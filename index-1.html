<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Harshley Odhiambo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F6F1;
  --ink:#18160F;
  --ink-soft:#7A7670;
  --accent:#1C3F2E;
  --accent-hover:#255238;
  --border:#E0DDD6;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);}

.landing{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2rem;
  position:relative;
  overflow:hidden;
}
.landing::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 40%, #d6eadc 0%, transparent 70%);
  opacity:.45;pointer-events:none;
}
.landing-inner{
  position:relative;z-index:1;
  text-align:center;
  animation:fadeUp .9s ease both;
}
.landing-tag{
  display:inline-block;
  font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:500;
  border:1px solid #a8c9b2;padding:.3rem .9rem;border-radius:999px;
  margin-bottom:1.8rem;
}
.landing-name{
  font-family:'DM Serif Display',serif;
  font-size:clamp(2.8rem,8vw,6rem);
  line-height:1.05;letter-spacing:-.02em;
  color:var(--ink);margin-bottom:.6rem;
}
.landing-name em{font-style:italic;color:var(--accent);}
.landing-title{
  font-size:clamp(.95rem,2vw,1.1rem);
  color:var(--ink-soft);font-weight:300;
  margin-bottom:2.8rem;letter-spacing:.02em;
}
.landing-links{
  display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;
  margin-bottom:3.5rem;
}
.btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.7rem 1.6rem;border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:500;
  text-decoration:none;transition:all .2s ease;cursor:pointer;border:none;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-2px);}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}
.btn svg{width:18px;height:18px;flex-shrink:0;}

.enter-portfolio{
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:.85rem;color:var(--ink-soft);text-decoration:none;
  letter-spacing:.04em;transition:color .2s;
}
.enter-portfolio:hover{color:var(--accent);}
.enter-portfolio svg{width:14px;height:14px;transition:transform .2s;}
.enter-portfolio:hover svg{transform:translateX(4px);}

.landing-scroll-hint{
  position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);
  font-size:.75rem;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;
  opacity:.6;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="landing">
  <div class="landing-inner">
    <span class="landing-tag">Available for work</span>
    <h1 class="landing-name">Harshley<br/><em>Odhiambo</em></h1>
    <p class="landing-title">Full Stack Developer &amp; Data Analyst · Nairobi, Kenya</p>
    <div class="landing-links">
      <a href="https://github.com/harshbyteart" target="_blank" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.604-3.369-1.341-3.369-1.341-.454-1.154-1.11-1.461-1.11-1.461-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
        GitHub
      </a>
      <a href="portfolio-1.html" class="btn btn-outline">
        View Portfolio
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
    <a href="portfolio-1.html" class="enter-portfolio">
      Explore my work
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
  <span class="landing-scroll-hint">harshley · nairobi</span>
</div>

</body>
</html>
